>{});}catch(_){}}\nlet fxAudio=null, fxOutput=null, fxSoundEnabled=false;\nfunction fxInitAudio(){\n try {\n  if(!fxAudio){const Context=window.AudioContext||window.webkitAudioContext;if(!Context)return false;\n   fxAudio=new Context();fxOutput=fxAudio.createGain();fxOutput.gain.value=.23;fxOutput.connect(fxAudio.destination);\n  }\n  if(fxAudio.state==='suspended')fxAudio.resume().catch(()=>{});\n  return true;\n }catch(_){return false}\n}\nfunction fxTone(freq,delay,duration,volume,type='sine'){\n if(!fxSoundEnabled||!fxAudio||!fxOutput)return;\n const t=fxAudio.currentTime+delay,o=fxAudio.createOscillator(),g=fxAudio.createGain();\n o.type=type;o.frequency.setValueAtTime(freq,t);\n g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0002,volume),t+.04);\n g.gain.exponentialRampToValueAtTime(.0001,t+duration);\n o.connect(g);g.connect(fxOutput);o.start(t);o.stop(t+duration+.04);\n}\n// A gentle water droplet: short, descending rounded sine plop, no melody.\nfunction fxFound(){\n if(!fxSoundEnabled||!fxAudio||!fxOutput)return;\n const t=fxAudio.currentTime+0.005;\n const o=fxAudio.createOscillator(),g=fxAudio.createGain();\n o.type='sine';\n o.frequency.setValueAtTime(1050,t);\n o.frequency.exponentialRampToValueAtTime(470,t+0.11);\n o.frequency.exponentialRampToValueAtTime(380,t+0.20);\n g.gain.setValueAtTime(0.0001,t);\n g.gain.exponentialRampToValueAtTime(0.19,t+0.012);\n g.gain.exponentialRampToValueAtTime(0.0001,t+0.23);\n o.connect(g);g.connect(fxOutput);o.start(t);o.stop(t+0.24);\n}\nfunction fxVictory(){[523.25,659.25,783.99,1046.5].forEach((n,i)=>fxTone(n,i*.115,.75,.17));}\nfunction fxToggleSound(){\n  fxSoundEnabled=!fxSoundEnabled;\n if(fxSoundEnabled){fxInitAudio();fxMusic.play().catch(()=>{});}\n  else {fxMusic.pause();}\n fxSoundButton.textContent=fxSoundEnabled?'🔊':'🔇';\n fxSoundButton.setAttribute('aria-pressed',String(fxSoundEnabled));\n}\nfxSoundButton.addEventListener('click',(e)=>{e.stopPropagation();fxUserChoseSound=tr cument.getElementById('art').src+'\")';\nconst stage=document.getElementById('stage');\nconst svg=document.getElementById('svg');\n// Closed states are local windows from an aligned natural-material edit.\nconst closedFrameSrc='assets/ddde67dcf417eb2a.png';\nconst patchSizes={1:[78,52],2:[70,48],3:[68,48],4:[70,48],5:[70,48]};\nfor(const face of faces){\n const group=document.createElement('div');group.id='closed-face-'+face.id;group.className='expression';group.setAttribute('aria-hidden','true');\n const [w,h]=patchSizes[face.id];\n for(const eye of face.eyes){\n  const box=document.createElement('span');box.className='eye-window';Object.assign(box.style,{left:(eye.x-w/2)+'px',top:(eye.y-h/2)+'px',width:w+'px',height:h+'px'});\n  const img=document.createElement('img');img.src=closedFrameSrc;img.alt='';Object.assign(img.style,{width:IMG_W+'px',height:IMG_H+'px',left:(w/2-eye.x)+'px',top:(h/2-eye.y)+'px'});\n  box.appendChild(img);group.appendChild(box);\n }\n stage.appendChild(group);\n}\nconst scoreEl=document.getElementById('score');\nconst hintsG=document.getElementById('hints');\nconst revealsG=document.getElementById('reveals');\nconst holdUi=document.getElementById('holdUi');\nconst toast=document.getElementById('toast');\nconst overlay=document.getElementById('overlay');\nconst againBtn=document.getElementById('againBtn');\nconst helpBtn=document.getElementById('helpBtn');\nlet baseScale=1, scale=0, minScale=1, maxScale=4.5, tx=0, ty=0;\nlet revealed=new Set();\nlet toastTimer=null, hintTimer=null;\nlet pointers=new Map();\nlet gesture=null;\nlet lastTap=0;\nlet holdTimer=null, holdState=null;\n\nfunction showToast(msg,duration=1400){\n toast.textContent=msg; toast.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>toast.classList.remove('show'),duration);\n}\nfunction setScore(){scoreEl.textContent=`${revealed.size} / ${faces.length}`;}\nfunction updateTransform(){stage.style.transform=`translate(${tx}px, ${ty}px) scale(${scale})`;}\nfunction fitToView(){\n const vw=viewer.clientWidth, vh=viewer.clientHeight;\n baseScale=Math.min(vw/IMG_W, vh/IMG_H);\n const coverScale=Math.max(vw/IMG_W,vh/IMG_H);\n if(vw<=600&&vh>vw&&coverScale/baseScale<=1.03)baseScale=coverScale;\n minScale=baseScale; if(scale<minScale||!isFinite(scale)) scale=minScale;\n const contentW=IMG_W*scale, contentH=IMG_H*scale;\n if(contentW<=vw) tx=(vw-contentW)/2; else tx=Math.min(0, Math.max(vw-contentW, tx));\n if(contentH<=vh) ty=(vh-contentH)/2; else ty=Math.min(0, Math.max(vh-contentH, ty));\n if(scale===minScale){tx=(vw-contentW)/2; ty=(vh-contentH)/2;}\n updateTransform();\n}\nfunction clampTransform(){\n const vw=viewer.clientWidth, vh=viewer.clientHeight;\n const contentW=IMG_W*scale, contentH=IMG_H*scale;\n if(contentW<=vw) tx=(vw-contentW)/2; else tx=Math.min(0, Math.max(vw-contentW, tx));\n if(contentH<=vh) ty=(vh-contentH)/2; else ty=Math.min(0, Math.max(vh-contentH, ty));\n updateTransform();\n}\nfunction screenToImage(clientX,clientY){\n const rect=viewer.getBoundingClientRect();\n return {x:(clientX-rect.left-tx)/scale, y:(clientY-rect.top-ty)/scale};\n}\nfunction distance(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}\nfunction midpoint(a,b){return {x:(a.x+b.x)/2,y:(a.y+b.y)/2}}\nfunction getEyeHit(pt){\n for(const face of faces){\n   if(revealed.has(face.id)) continue;\n   for(let idx=0; idx<face.eyes.length; idx++){\n     const e=face.eyes[idx];\n     const rx=face.eyeRadius || 22, ry=(face.eyeRadius||22)*0.82;\n     const d=Math.hypot((pt.x-e.x)/rx,(pt.y-e.y)/ry);\n     if(d<=1) return {faceId:face.id, eyeIndex:idx, eye:e, face};\n   }\n }\n return null;\n}\nfunction clearHoldUi(){holdUi.replaceChildren();}\nfunction drawHoldProgress(pt,p){\n clearHoldUi();\n const radius=44/scale, ns='http://www.w3.org/2000/svg';\n for(const progress of [false,true]){\n  const ring=document.createElementNS(ns,'circle');\n  ring.setAttribute('cx',pt.x);ring.setAttribute('cy',pt.y);ring.setAttribute('r',radius);\n  ring.setAttribute('fill','none');ring.setAttribute('stroke',p>=1?'#b9f3c7':'#f7e7b2');ring.setAttribute('stroke-width',3/scale);\n  ring.style.filter='drop-shadow(0 0 2px #162019)';ring.style.pointerEvents='none';\n  if(progress){ring.setAttribute('stroke-dasharray',2*Math.PI*radius);ring.setAttribute('stroke-dashoffset',2*Math.PI*radius*(1-p));ring.setAttribute('transform',`rotate(-90 ${pt.x} ${pt.y})`);ring.setAttribute('stroke-linecap','round');}\n  else ring.setAttribute('opacity','.4');\n  holdUi.appendChild(ring);\n }\n}\nfunction scheduleHold(pointerId, hit, startClient){\n clearTimeout(holdTimer);\n const t0=performance.now();\n holdState={pointerId, hit, activated:false, released:false, startClient, lastClient:startClient, raf:0};\n function tick(now){\n   if(!holdState || holdState.pointerId!==pointerId || holdState.released) return;\n   const p=Math.min(1,(now-t0)/350);\n   const pt=screenToImage(holdState.lastClient.x, holdState.lastClient.y);\n   drawHoldProgress(pt,p);\n   if(p>=1){holdState.activated=true; showToast(__hipsT('ready'),1000); return;}\n   holdState.raf=requestAnimationFrame(tick);\n }\n holdState.raf=requestAnimationFrame(tick);\n holdTimer=setTimeout(()=>{ if(holdState && holdState.pointerId===pointerId) holdState.activated=true; },350);\n}\nfunction cancelHold(){ if(holdState?.raf) cancelAnimationFrame(holdState.raf); clearTimeout(holdTimer); holdState=null; clearHoldUi(); }\nconst expressionTimers={1:[],2:[],3:[],4:[],5:[]};\nfunction clearExpressionTimers(){for(const id of [1,2,3,4,5]) {expressionTimers[id].forEach(clearTimeout);expressionTimers[id]=[];}}\nfunction setExpressionFor(id,which){document.getElementById('closed-face-'+id).classList.toggle('visible',which==='closed');}\nfunction revealFace(face){\n if(revealed.has(face.id)) return;\n revealed.add(face.id);try{navigator.vibrate?.(25)}catch(e){};\n window.parent.postMessage({kind:'hips-save',level:4,ids:[...revealed]},'*');\n expressionTimers[face.id].forEach(clearTimeout); expressionTimers[face.id]=[];\n const startDelay=1200; // Time to move cursor or finger away before every blink.\n showToast(face.id===4 ? __hipsT('waking4') : __hipsT('waking4'),900);\n function finishBlink(){\n   setExpressionFor(face.id,'open'); // Restore original artwork after blinking; no permanent smiles.\n   setScore();\n   fxFound();\n   showToast(__hipsT('discovered'),1200);\n   if(revealed.size===faces.length){\n     document.getElementById('app').classList.add('awakened'); fxCelebrate();\n     expressionTimers[face.id].push(setTimeout(()=>overlay.classList.add('on'),2100));\n   }\n }\n function beginBlink(){\n   setExpressionFor(face.id,'closed'); fxBlink();\n   expressionTimers[face.id].push(setTimeout(finishBlink,300));\n }\n if(startDelay){\n   expressionTimers[face.id].push(setTimeout(beginBlink,startDelay));\n } else beginBlink();\n}\nfunction resetGame(){\n clearExpressionTimers();\n setExpressionFor(1,'open'); setExpressionFor(2,'open'); setExpressionFor(3,'open'); setExpressionFor(4,'open'); setExpressionFor(5,'open');\n revealed.clear(); window.parent.postMessage({kind:'hips-save',level:4,ids:[]},'*'); revealsG.replaceChildren(); hintsG.replaceChildren();\n overlay.classList.remove('on'); document.getElementById('app').classList.remove('awakened'); clearTimeout(hintTimer); cancelHold(); setScore();\n showToast(__hipsT('fresh'));\n}\nfunction showHint(){\n hintsG.replaceChildren();\n const face=faces.find(f=>!revealed.has(f.id));\n if(!face) return;\n const target=face.eyes[0];\n const c=document.createElementNS('http://www.w3.org/2000/svg','circle');\n c.setAttribute('cx',target.x); c.setAttribute('cy',target.y); c.setAttribute('r',32); c.setAttribute('class','hintPulse');\n hintsG.appendChild(c);\n showToast(__hipsT('hintToast'));\n clearTimeout(hintTimer); hintTimer=setTimeout(()=>hintsG.replaceChildren(),1600);\n}\nfunction zoomAt(clientX, clientY, newScale){\n const rect=viewer.getBoundingClientRect();\n const anchorX=clientX-rect.left, anchorY=clientY-rect.top;\n const imgX=(anchorX-tx)/scale, imgY=(anchorY-ty)/scale;\n scale=Math.max(minScale, Math.min(maxScale, newScale));\n tx=anchorX-imgX*scale; ty=anchorY-imgY*scale;\n clampTransform();\n}\nfunction onPointerDown(e){\n if(e.pointerType==='mouse' && e.button!==0) return;\n viewer.setPointerCapture?.(e.pointerId);\n pointers.set(e.pointerId, {x:e.clientX,y:e.clientY});\n if(pointers.size===1){\n   const now=Date.now();\n   const hit=getEyeHit(screenToImage(e.clientX,e.clientY));\n   gesture={type:'single', pointerId:e.pointerId, start:{x:e.clientX,y:e.clientY}, last:{x:e.clientX,y:e.clientY}, moved:false, hit};\n   if(hit) scheduleHold(e.pointerId, hit, {x:e.clientX,y:e.clientY});\n   if(now-lastTap<280){ zoomAt(e.clientX,e.clientY, scale>minScale*1.25 ? minScale : minScale*2.5); lastTap=0; cancelHold(); return; }\n   lastTap=now;\n } else if(pointers.size===2){\n   cancelHold();\n   const [a,b]=[...pointers.values()];\n   const mid=midpoint(a,b), rect=viewer.getBoundingClientRect();\n   gesture={type:'pinch', startDist:Math.max(1,distance(a,b)), startScale:scale, anchorX:(mid.x-rect.left-tx)/scale, anchorY:(mid.y-rect.top-ty)/scale};\n }\n e.preventDefault();\n}\nfunction onPointerMove(e){\n if(!pointers.has(e.pointerId)) return;\n pointers.set(e.pointerId, {x:e.clientX,y:e.clientY});\n if(gesture?.type==='single' && gesture.pointerId===e.pointerId){\n   const dx=e.clientX-gesture.start.x, dy=e.clientY-gesture.start.y;\n   const dist=Math.hypot(dx,dy);\n   if(dist>10 && !gesture.moved){ gesture.moved=true; cancelHold(); }\n   if(holdState && holdState.pointerId===e.pointerId) holdState.lastClient={x:e.clientX,y:e.clientY};\n   if(!holdState?.activated){\n     tx += e.clientX-gesture.last.x;\n     ty += e.clientY-gesture.last.y;\n     gesture.last={x:e.clientX,y:e.clientY};\n     clampTransform();\n   }\n } else if(gesture?.type==='pinch' && pointers.size>=2){\n   const [a,b]=[...pointers.values()];\n   const dist=distance(a,b), mid=midpoint(a,b);\n   const factor=d const LANGUAGE_KEY='hidden-in-plain-sight-language-v1';
let language='en';try{const saved=localStorage.getItem(LANGUAGE_KEY);if(Object.hasOwn(HIPS_TRANSLATIONS,saved))language=saved;}catch(e){}
function translate(key,values={}){return (HIPS_TRANSLATIONS[language][key]??HIPS_TRANSLATIONS.en[key]??key).replace(/\{(\w+)\}/g,(_,k)=>values[k]??'{'+k+'}');}
function escapeHtml(text){return text.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function localizedLevel(n){
 const dict=HIPS_TRANSLATIONS[language];
 let html=levels[n].replace(/__HIPS_(\w+)__/g,(_,key)=>escapeHtml(dict[key]??HIPS_TRANSLATIONS.en[key]??key));
 html=html.replace(/<html lang="[^"]*"/,'<html lang="'+language+'"');
 const helper='const __hipsDictionary='+JSON.stringify(dict)+';function __hipsT(key,values={}){return (__hipsDictionary[key]??key).replace(/\\{(\\w+)\\}/g,(_,k)=>values[k]??"{"+k+"}");}';
 return html.replace('<script>','<script>'+helper);
}
function applyLanguage(){
 document.documentElement.lang=language;
 document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=translate(el.dataset.i18n));
 document.getElementById('language').value=language;
 document.getElementById('language').setAttribute('aria-label',translate('language'));
 document.getElementById('game').title='HIDDEN IN PLAIN SIGHT';
 document.getElementById('smallmenu').textContent='☰ '+translate('levels');
 document.getElementById('shareStatus').textContent='';summary();
}
const KEY='hidden-in-plain-sight-progress-v1';
const frame=document.getElementById('game'),menu=document.getElementById('menu'),loading=document.getElementById('loading'),smallmenu=document.getElementById('smallmenu');
const levels={1:level1,2:level2,3:level3,4:level4,5:level5};
const limits={1:5,2:7,3:5,4:5,5:7};
const titles={1:'THE STONE VILLAGE',2:'THE ENCHANTED FOREST',3:'THE SUNNY MEADOW',4:'THE SUNKEN SHIP',5:'THE ANTIQUE ROOM'};
let active=0,replayMode=false;
let progress={last:1,levels:{1:[],2:[],3:[],4:[],5:[]}};
function unlocked(n){return n===1 || (n===2&&progress.levels[1].length===5) || (n===3&&progress.levels[1].length===5&&progress.levels[2].length===7) || (n===4&&progress.levels[1].length===5&&progress.levels[2].length===7&&progress.levels[3].length===5) || (n===5&&progress.levels[1].length===5&&progress.levels[2].length===7&&progress.levels[3].length===5&&progress.levels[4].length===5);}
function readSave(){try{
 const obj=JSON.parse(localStorage.getItem(KEY)||'null');if(!obj||typeof obj!=='object')return;
 for(const n of [1,2,3,4,5]){const vals=obj.levels?.[n];if(Array.isArray(vals))progress.levels[n]=[...new Set(vals.filter(id=>Number.isInteger(id)&&id>=1&&id<=limits[n]))];}
 progress.last=[1,2,3,4,5].includes(obj.last)&&unlocked(obj.last)?obj.last:1;
}catch(e){console.warn('Save unavailable',e);}}
function store(){try{localStorage.setItem(KEY,JSON.stringify(progress))}catch(e){document.getElementById('note').textContent=translate('saveError');}}
function continueTarget(){const last=progress.last;if(unlocked(last)&&progress.levels[last].length<limits[last])return last;return [1,2,3,4,5].find(n=>unlocked(n)&&progress.levels[n].length<limits[n])||5;}
function summary(){
 document.getElementById('summary').textContent=[1,2,3,4,5].map(n=>`${translate('level')} ${n}  ${progress.levels[n].length}/${limits[n]}`).join('    ·    ');
 for(const n of [1,2,3,4,5]){const b=document.getElementById('choose'+n),complete=progress.levels[n].length===limits[n];b.disabled=!unlocked(n);b.textContent=!unlocked(n)?'🔒 '+translate('locked',{n,previous:n-1}):`${complete?'↻ '+translate('replay')+' ':''}${translate('level')} ${n} · ${translate('title'+n)}`;}
 const target=continueTarget();document.getElementById('continue').textContent=progress.levels[5].length===7?translate('revisit'):`${translate('continue')} · ${translate('level')} ${target}`;
}
function openMenu(){summary();menu.hidden=false;smallmenu.hidden=true;}
function startLevel(n,forceReplay=false){
 if(!unlocked(n)){document.getElementById('note').textContent=translate('previous');return;}
 active=n;replayMode=forceReplay;progress.last=n;store();menu.hidden=true;smallmenu.hidden=false;
 loading.hidden=false;loading.querySelector('small').textContent=translate('loading',{n});
 frame.onload=()=>{loading.hidden=true;frame.contentWindow.postMessage({kind:'hips-restore',level:n,ids:replayMode?[]:progress.levels[n]},'*');};
 frame.srcdoc=localizedLevel(n);
}
window.addEventListener('message',e=>{
 if(e.source!==frame.contentWindow||!e.data||typeof e.data!=='object')return;
 if(e.data.kind==='hips-save'&&e.data.level===active&&!replayMode&&Array.isArray(e.data.ids)){
  progress.levels[active]=[...new Set(e.data.ids.filter(id=>Number.isInteger(id)&&id>=1&&id<=limits[active]))];store();summary();
 }
 if(e.data.kind==='hips-replay'&&e.data.level===active)startLevel(active,true);
 if(e.data.kind==='hips-next'&&e.data.level===active+1&&unlocked(e.data.level))startLevel(e.data.level);
});
document.getElementById('continue').addEventListener('click',()=>startLevel(continueTarget()));
for(const n of [1,2,3,4,5])document.getElementById('choose'+n).addEventListener('click',()=>startLevel(n,progress.levels[n].length===limits[n]));

const GAME_URL='https://tv9jg7pv2j-cmyk.github.io/hidden-in-plain-sight/';
const shareButton=document.getElementById('shareGame'),shareStatus=document.getElementById('shareStatus'),shareDialog=document.getElementById('shareFallback');
async function copyGameLink(){
 try{if(!navigator.clipboard?.writeText)throw new Error('No clipboard');await navigator.clipboard.writeText(GAME_URL);shareStatus.textContent=translate('copied');}
 catch(e){const input=document.getElementById('shareLink');input.value=GAME_URL;if(!shareDialog.open)shareDialog.showModal();input.focus();input.select();input.setSelectionRange(0,input.value.length);}
}
shareButton.addEventListener('click',async()=>{
 shareStatus.textContent='';shareButton.disabled=true;
 try{if(navigator.share){try{await navigator.share({title:'HIDDEN IN PLAIN SIGHT',text:translate('shareText'),url:GAME_URL});return;}catch(e){if(e.name==='AbortError')return;}}await copyGameLink();}
 finally{shareButton.disabled=false;}
});
document.getElementById('closeShare').addEventListener('click',()=>shareDialog.close());

smallmenu.addEventListener('click',openMenu);document.getElementById('language').addEventListener('change',e=>{language=e.target.value;try{localStorage.setItem(LANGUAGE_KEY,language)}catch(e){}applyLanguage();});readSave();applyLanguage();
</script></body></html>
