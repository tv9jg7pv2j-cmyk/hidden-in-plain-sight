 for(const level of [1,2]){const limit=level===1?5:7;const vals=obj.levels?.[level];if(Array.isArray(vals))progress.levels[level]=[...new Set(vals.filter(n=>Number.isInteger(n)&&n>=1&&n<=limit))];}

 const next=a<5?1:2;
 document.getElementById('continue').textContent=b===7?'REVISIT LEVEL 2':a===5&&b===0?'CONTINUE · LEVEL 2':`CONTINUE · LEVEL ${progress.last===2&&unlocked(2)?2:next}`;

 frame.srcdoc=n===1?level1:level2;
}

 if(e.source!==frame.contentWindow||!e.data||typeof e.data!=='object')return;
